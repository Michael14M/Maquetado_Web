<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recibo</title> 
    <link rel="stylesheet" href="recibo4.css">
</head>
<body>
<div class="recibo-container">
    
    <div class="header">
        <div class="logo-area">
            <div class="logo-title">
                <span class="logo-green">GREEN</span> 
                <span class="logo-and">&amp;</span> 
                <span class="logo-blue">BLUE</span>
            </div>
            <div class="logo-subtitle">aquamarine</div>
            <div class="logo-slogan">Efecto y prevención en la funcionalidad física</div>
            
            <div class="services-grid">
                <label class="service-item"><input type="checkbox" class="checkbox-interactivo"> REHABILITACIÓN</label>
                <label class="service-item"><input type="checkbox" class="checkbox-interactivo"> ENTRETENIMIENTO</label>
                <label class="service-item"><input type="checkbox" class="checkbox-interactivo"> MASAJES</label>
                <label class="service-item"><input type="checkbox" class="checkbox-interactivo"> NATACIÓN</label>
            </div>
        </div>

        <div class="header-right">
            <div class="phones">📞 318 868 8008 / 310 740 6038</div>
            <div class="recibo-box">
                <div class="recibo-label">RECIBO</div>
                <div class="recibo-number">N° <input type="text" value="0458" class="input-no"></div>
            </div>
        </div>
    </div>

    <div class="info-section">
        <div>
            <div class="input-row"><span>Señor (es):</span><div class="line-fill"><input type="text" class="input-editable"></div></div>
            <div class="input-row"><span>Dirección:</span><div class="line-fill"><input type="text" class="input-editable"></div></div>
            <div class="input-row"><span>Teléfono:</span><div class="line-fill"><input type="tel" class="input-editable"></div></div>
        </div>
        
        <div class="dates-container">
            <div class="date-box">
                <div>Fecha Inicio</div>
                <div class="dates-cells">
                    <input type="text" class="date-cell-input" placeholder="DD" maxlength="2">
                    <input type="text" class="date-cell-input" placeholder="MM" maxlength="2">
                    <input type="text" class="date-cell-input" placeholder="AAAA" maxlength="4">
                </div>
            </div>
            <div class="date-box">
                <div>Fecha Finalización</div>
                <div class="dates-cells">
                    <input type="text" class="date-cell-input" placeholder="DD" maxlength="2">
                    <input type="text" class="date-cell-input" placeholder="MM" maxlength="2">
                    <input type="text" class="date-cell-input" placeholder="AAAA" maxlength="4">
                </div>
            </div>
        </div>
    </div>

    <div class="physical-data">
        <div class="input-row flex-2"><span>Ciudad:</span><div class="line-fill"><input type="text" class="input-editable"></div></div>
        <div class="input-row flex-1"><span>Edad:</span><div class="line-fill"><input type="text" class="input-editable"></div></div>
        <div class="input-row flex-1"><span>Peso:</span><div class="line-fill"><input type="text" class="input-editable"></div></div>
        <div class="input-row flex-1"><span>Talla:</span><div class="line-fill"><input type="text" class="input-editable"></div></div>
        <div class="input-row flex-1"><span>PPL:</span><div class="line-fill"><input type="text" class="input-editable"></div></div>
    </div>

    <table class="main-table">
        <thead>
            <tr>
                <th class="col-desc">DESCRIPCIÓN</th>
                <th class="col-val">VR. TOTAL</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><textarea class="textarea-tabla" placeholder="Escriba aquí los detalles de forma directa..."></textarea></td>
                <td>
                    <div class="valor-container-cell">
                        <span>$</span>
                        <input type="text" class="input-tabla-valor">
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="footer-table-area">
        <div class="observaciones-box">
            <span class="observaciones-label">OBSERVACIONES</span>
            <textarea class="textarea-observaciones"></textarea>
        </div>
        <div class="total-box">
            <div class="total-label">TOTAL</div>
            <div class="total-value">$ <input type="text" class="input-total"></div>
        </div>
    </div>

    <div class="signatures-section">
        <div class="signature-block">
            <input type="text" class="input-firma" placeholder="Escriba aquí">
            <div class="linea-decorativa-firma"></div>
            <div class="texto-firma">FIRMA DEL INSTRUCTOR</div>
        </div>
        <div class="signature-block">
            <input type="text" class="input-firma" placeholder="Escriba aquí">
            <div class="linea-decorativa-firma"></div>
            <div class="texto-firma">FIRMA DEL USUARIO</div>
        </div>
    </div>

</div>
</body>
</html>
