<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recibo Green & Blue</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="receipt">
    
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <strong>GREEN & BLUE</strong><br>
        <span>aqua marine</span>
      </div>
      <div class="title-right">
        <strong>REHABILITACIÓN</strong><br>
        ENTRETENIMIENTO • MASAJES • NATACIÓN
      </div>
    </div>

    <div class="receipt-number">
      <strong>Nº RECIBO</strong><br>
      <span class="number">0458</span>
    </div>

    <!-- Form Content -->
    <table class="form-table">
      <tr>
        <td class="label">Señor(es):</td>
        <td class="input-field" colspan="3"></td>
      </tr>
      <tr>
        <td class="label">Teléfono:</td>
        <td class="input-field"></td>
        <td class="label">Fecha Inicio</td>
        <td class="input-field small"></td>
      </tr>
      <tr>
        <td class="label">Ciudad:</td>
        <td class="input-field"></td>
        <td class="label">Fecha Finalización</td>
        <td class="input-field small"></td>
      </tr>
      <tr>
        <td class="label">Dirección:</td>
        <td class="input-field" colspan="3"></td>
      </tr>
      <tr>
        <td class="label">Edad:</td>
        <td class="input-field small"></td>
        <td class="label">Peso:</td>
        <td class="input-field small"></td>
      </tr>
      <tr>
        <td class="label">Talla:</td>
        <td class="input-field small"></td>
        <td colspan="2"></td>
      </tr>
    </table>

    <!-- Descripción -->
    <div class="section">
      <div class="section-title">DESCRIPCIÓN</div>
      <div class="big-box"></div>
    </div>

    <!-- Observaciones -->
    <div class="section">
      <div class="section-title">OBSERVACIONES</div>
      <div class="big-box"></div>
    </div>

    <!-- Firmas -->
    <div class="signatures">
      <div class="firma">
        <div class="line"></div>
        <div>FIRMA DEL INSTRUCTOR</div>
      </div>
      <div class="firma">
        <div class="line"></div>
        <div>FIRMA DEL USUARIO</div>
      </div>
    </div>

    <!-- Total -->
    <div class="total-section">
      <table class="total-table">
        <tr>
          <td class="label-total">TOTAL</td>
          <td class="amount">$</td>
        </tr>
        <tr>
          <td class="label-total">VR. TOTAL PPL.</td>
          <td class="amount"></td>
        </tr>
      </table>
    </div>

  </div>
</body>
</html>
