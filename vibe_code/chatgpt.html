<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recibo Green & Blue</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="recibo">

  <!-- Encabezado -->
  <div class="header">
    <div class="logo-section">
      <h1>GREEN<span>&</span>BLUE</h1>
      <p>aquamarine</p>
      <small>Más espacio en tu localidad física</small>
    </div>

    <div class="services">
      <label><input type="checkbox"> REHABILITACIÓN</label>
      <label><input type="checkbox"> ENTRETENIMIENTO</label>
      <label><input type="checkbox"> MASAJES</label>
      <label><input type="checkbox"> NATACIÓN</label>
    </div>
  </div>

  <!-- Fechas y recibo -->
  <div class="top-info">
    <div class="dates">
      <div class="date-box">
        <span>Fecha Inicio</span>
        <div class="boxes">
          <div></div><div></div><div></div>
        </div>
      </div>

      <div class="date-box">
        <span>Fecha Finalización</span>
        <div class="boxes">
          <div></div><div></div><div></div>
        </div>
      </div>
    </div>

    <div class="receipt-number">
      <span>RECIBO</span>
      <div class="number">No 0458.</div>
    </div>
  </div>

  <!-- Información -->
  <div class="info-grid">
    <div>
      <label>Señor (es):</label>
      <div class="line"></div>
    </div>

    <div>
      <label>Dirección:</label>
      <div class="line"></div>
    </div>

    <div>
      <label>Teléfono:</label>
      <div class="line"></div>
    </div>

    <div>
      <label>Ciudad:</label>
      <div class="line"></div>
    </div>

    <div>
      <label>Edad:</label>
      <div class="line"></div>
    </div>

    <div>
      <label>Peso:</label>
      <div class="line"></div>
    </div>

    <div>
      <label>Talla:</label>
      <div class="line"></div>
    </div>

    <div>
      <label>PPL:</label>
      <div class="line"></div>
    </div>
  </div>

  <!-- Tabla -->
  <div class="table-section">

    <div class="table-header">
      <div class="description">DESCRIPCIÓN</div>
      <div class="vr-total">VR. TOTAL</div>
    </div>

    <div class="table-body">
      <div class="description-area"></div>
      <div class="total-area"></div>
    </div>

    <div class="observaciones">
      <div class="obs-label">OBSERVACIONES</div>
      <div class="obs-content"></div>
    </div>

    <div class="total-box">
      <div class="total-label">TOTAL</div>
      <div class="currency">$</div>
    </div>

  </div>

  <!-- Firmas -->
  <div class="signatures">
    <div class="signature">
      <div class="line-sign"></div>
      <span>FIRMA DEL INSTRUCTOR</span>
    </div>

    <div class="signature">
      <div class="line-sign"></div>
      <span>FIRMA DEL USUARIO</span>
    </div>
  </div>

</div>

</body>
</html>
