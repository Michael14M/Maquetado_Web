<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parrafos y Encabezados</title>
</head>
<body>
    <!-- Titulos o Encabezados:
    se tienen 6 tipos de encabezados, desde el h1 hasta el h6. -->
    <!-- (h$*6) Crea 6 titulo en orden del 1 al 6 Emmet -->
        <h1>Titulo</h1>
        <!-- El h1 se utiliza una solo vez por pagina web esto es debido a que el h1 tiene una importancia en el CEO lo que es el posicionamiento web, es decir, google le da mucha importancia al h1  -->
        <h2>SUbtitulo</h2>
        <h3>SUbtitulo</h3>
        <h4>SUbtitulo</h4>
        <h5>SUbtitulo</h5>
        <h6>SUbtitulo</h6>
        <!-- Desde el h2 hasta el h6, se pueden utilizar las veces que sean necesarias segun el contenido que se requieer recrear -->
        
        <!-- Prrafo: Los parrafos deben tener una idea o punto especifico.
        Cada parrafo escritodebe de contener un concepto, una idea. Es decir, puede describir una seccion o un elemento, hasta un mensaje en el chat. PO ejemplo en una seccion se habla sobre los benefcios del ejercicio:
        Un parrafo puede tratar de mejorar la salud cardiovascular y otro puede ser sobre los beneicios y cuidados de la salud mental. Finalmente, debe existir un motivo para que exista un parrafo. -->
        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolore minus voluptatem doloribus! Architecto praesentium assumenda obcaecati harum at dicta eius ad expedita quibusdam excepturi facere porro dolor, aut aliquid quaerat.
        </p>
        <!-- (CTRL+SHIFT+P) o (ALT+Z) Ajusta el contenido del parrafo a ala ventana del editor -->
        <!-- Existen algunas tecnologias de assistencia como lectores de pantalla, que ayudan a las personas con discapaacidad visual a navegar por el contenido web.
        Por ejemplo: Cuando estas tecnologias leen el h1 de la pagina, entienden de que trata la pagina por el h1. Por temas de accesibilidad web es importante que se utilice solo un h1 por pagina. -->
</body>
</html>
